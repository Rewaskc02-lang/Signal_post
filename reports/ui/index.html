<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signalpost — Company Profiles</title>
  <meta name="description" content="Browse Norwegian company intelligence profiles extracted by Signalpost.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ─── Design tokens ── 60‑30‑10 rule ──────────────────────── */
    :root {
      /* 60 % — Dominant (canvas / backgrounds) */
      --bg-canvas:      #090a0f;
      --bg-surface:     #10141e;
      --bg-card:        #141926;
      --bg-card-hover:  #1a2133;

      /* 30 % — Secondary structure (plum) */
      --plum:           #3a0f34;
      --plum-surface:   rgba(58,15,52,0.55);
      --plum-border:    rgba(115,34,104,0.55);

      /* 10 % — Accent / CTA (gold) */
      --gold:           #eaaa00;
      --gold-hover:     #f5b81a;
      --gold-surface:   rgba(234,170,0,0.12);
      --gold-border:    rgba(234,170,0,0.40);

      /* Typography (#DDE3E8 palette) */
      --text-pure:      #ffffff;
      --text-primary:   #dde3e8;
      --text-secondary: #9aa5b5;
      --text-muted:     #647082;

      /* Borders */
      --border:         rgba(221,227,232,0.12);
      --border-hover:   rgba(221,227,232,0.22);

      /* Misc */
      --radius:  10px;
      --ease:    all .2s cubic-bezier(.16,1,.3,1);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg-canvas);
      color:var(--text-primary);
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }

    /* ─── Layout ──────────────────────────────────────────────── */
    .shell{max-width:1120px;margin:0 auto;padding:32px 24px 80px}

    /* ─── Header ──────────────────────────────────────────────── */
    header{
      display:flex;align-items:center;gap:16px;
      padding-bottom:24px;border-bottom:1px solid var(--border);
      margin-bottom:28px;flex-wrap:wrap;
    }
    .logo{
      width:44px;height:44px;border-radius:var(--radius);
      background:var(--plum);border:1px solid var(--gold-border);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 18px rgba(58,15,52,.45);flex-shrink:0;
    }
    .logo svg{width:26px;height:26px}
    header h1{font-size:1.45rem;font-weight:800;color:var(--text-pure);letter-spacing:-.02em}
    header h1 span{
      font-size:.65rem;font-weight:700;color:var(--gold);
      background:var(--plum-surface);border:1px solid var(--gold-border);
      padding:3px 9px;border-radius:9999px;margin-left:10px;vertical-align:middle;
      letter-spacing:.5px;
    }
    header p{font-size:.82rem;color:var(--text-secondary);margin-top:2px}

    /* ─── Stats row ───────────────────────────────────────────── */
    .stats{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:12px;margin-bottom:24px;
    }
    .stat{
      background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
      padding:18px 14px;text-align:center;transition:var(--ease);
    }
    .stat:hover{border-color:var(--gold-border);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
    .stat .n{font-size:1.7rem;font-weight:800;color:var(--gold);line-height:1.2}
    .stat .l{font-size:.65rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-top:6px}

    /* ─── Search ──────────────────────────────────────────────── */
    .search-bar{
      position:relative;margin-bottom:24px;
    }
    .search-bar input{
      width:100%;padding:14px 16px 14px 46px;
      background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
      color:var(--text-pure);font-size:.95rem;font-family:inherit;outline:none;
      transition:var(--ease);
    }
    .search-bar input::placeholder{color:var(--text-muted)}
    .search-bar input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(234,170,0,.18)}
    .search-bar .icon{
      position:absolute;left:16px;top:50%;transform:translateY(-50%);
      color:var(--text-muted);pointer-events:none;display:flex;
    }

    /* ─── Table ───────────────────────────────────────────────── */
    .table-wrap{
      background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
      overflow:hidden;
    }
    table{width:100%;border-collapse:collapse}
    thead{background:var(--plum-surface)}
    th{
      text-align:left;padding:13px 16px;font-size:.7rem;font-weight:700;
      text-transform:uppercase;letter-spacing:.6px;color:var(--text-secondary);
      border-bottom:1px solid var(--border);
    }
    td{
      padding:14px 16px;font-size:.88rem;border-bottom:1px solid var(--border);
      vertical-align:middle;
    }
    tr:last-child td{border-bottom:none}
    tr{transition:var(--ease)}
    tr:hover td{background:var(--bg-card-hover)}
    td.name{font-weight:600;color:var(--text-pure)}
    td.orgnr{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--text-secondary)}
    .view-link{
      color:var(--gold);text-decoration:none;font-weight:600;font-size:.82rem;
      padding:5px 12px;border:1px solid var(--gold-border);border-radius:9999px;
      transition:var(--ease);display:inline-block;
    }
    .view-link:hover{background:var(--gold);color:#090a0f}
    .badge{
      display:inline-block;padding:3px 8px;border-radius:9999px;font-size:.68rem;
      font-weight:700;letter-spacing:.3px;
    }
    .badge-ok{background:rgba(46,213,115,.12);color:#2ed573;border:1px solid rgba(46,213,115,.35)}
    .badge-na{background:rgba(154,165,181,.12);color:#9aa5b5;border:1px solid rgba(154,165,181,.28)}
    .badge-err{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.35)}

    .empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:.95rem}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    select{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:8px;margin-left:6px}
    select:focus{outline:2px solid var(--gold);outline-offset:2px}
    .compare-bar{display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--plum-surface);border:1px solid var(--gold-border);border-radius:8px;padding:10px 12px;margin-bottom:16px}
    .compare-bar.visible{display:flex}.compare-bar button{background:var(--gold);border:0;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer}
    .compare-panel{display:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;overflow:auto}
    .compare-panel.visible{display:block}.compare-panel table{min-width:520px}

    /* ─── Footer ──────────────────────────────────────────────── */
    footer{margin-top:40px;text-align:center;font-size:.78rem;color:var(--text-muted)}
    footer a{color:var(--gold);text-decoration:none}

    /* ─── Responsive ──────────────────────────────────────────── */
    @media(max-width:640px){
      .shell{padding:18px 12px 60px}
      header h1{font-size:1.15rem}
      .stats{grid-template-columns:repeat(2,1fr)}
      th,td{padding:10px 10px;font-size:.8rem}
      .view-link{padding:4px 8px;font-size:.72rem}
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#eaaa00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div id="compareBar" class="compare-bar" role="status">
      <span id="compareCount">0 profiles selected</span>
      <button id="compareButton" type="button">Compare selected</button>
    </div>
    <div id="comparePanel" class="compare-panel" aria-live="polite"></div>
    <div>
      <h1>Signalpost <span>C300</span></h1>
      <p>Norwegian company intelligence profiles</p>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats" id="stats">
    <div class="stat"><div class="n" id="st-total">—</div><div class="l">Total profiles</div></div>
    <div class="stat"><div class="n" id="st-ok">—</div><div class="l">Available</div></div>
    <div class="stat"><div class="n" id="st-na">—</div><div class="l">Not available</div></div>
    <div class="stat"><div class="n" id="st-err">—</div><div class="l">Failed / Other</div></div>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <span class="icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <label for="q" class="sr-only">Search profiles</label>
    <input type="search" id="q" placeholder="Search by company name, org number, city, or industry…" autocomplete="off">
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px">
    <label>Status
      <select id="stateFilter" aria-label="Filter by availability">
        <option value="">All statuses</option><option value="available">Available</option><option value="failed">Failed</option>
      </select>
    </label>
    <label>Category
      <select id="categoryFilter" aria-label="Filter by research category">
        <option value="">All categories</option>
      </select>
    </label>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead><tr><th>Select</th><th>#</th><th>Company</th><th>Org Nr</th><th>Status</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No profiles match your search.</div>
  </div>

  <footer>
    Signalpost &middot; Built for the Builderr C300 evaluation &middot; <a href="https://github.com/Rewaskc02-lang/Signal_post" target="_blank">GitHub</a>
  </footer>
</div>

<script>
(function(){
  const tbody = document.getElementById('tbody');
  const input = document.getElementById('q');
  const stateFilter = document.getElementById('stateFilter');
  const categoryFilter = document.getElementById('categoryFilter');
  const compareBar = document.getElementById('compareBar');
  const compareCount = document.getElementById('compareCount');
  const comparePanel = document.getElementById('comparePanel');
  const selected = new Set();
  const empty = document.getElementById('empty');
  let profiles = [];

  // Load manifest
  fetch('profiles_index.json')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      profiles = data;
      [...new Set(profiles.flatMap(p => p.categories || []))].sort().forEach(category => {
        categoryFilter.insertAdjacentHTML('beforeend', `<option value="${esc(category)}">${esc(category)}</option>`);
      });
      computeStats(); render();
    })
    .catch(() => {
      // Fallback: try loading individual profile files list
      empty.style.display = '';
      empty.textContent = 'Could not load profiles_index.json. Run the manifest generator first.';
    });

  function computeStats(){
    let ok=0, na=0, err=0;
    profiles.forEach(p => {
      if(p.state === 'available') ok++;
      else if(p.state === 'not_available' || p.state === 'not_applicable') na++;
      else err++;
    });
    document.getElementById('st-total').textContent = profiles.length;
    document.getElementById('st-ok').textContent = ok;
    document.getElementById('st-na').textContent = na;
    document.getElementById('st-err').textContent = err;
  }

  function render(){
    const term = input.value.toLowerCase().trim();
    const state = stateFilter.value;
    const category = categoryFilter.value;
    const filtered = profiles.filter(p =>
      (p.name||'').toLowerCase().includes(term) ||
      (p.orgnr||'').toString().includes(term) ||
      (p.city||'').toLowerCase().includes(term) ||
      (p.industry||'').toLowerCase().includes(term)
    ).filter(p => (!state || p.state === state) && (!category || (p.categories || []).includes(category)));
    if(filtered.length === 0){
      tbody.innerHTML = '';
      empty.style.display = '';
      empty.textContent = term ? 'No profiles match your search.' : 'No profiles loaded.';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = filtered.map((p, i) => {
      const st = p.state || 'unknown';
      let badgeCls = 'badge-na';
      let badgeLabel = st.replace(/_/g,' ');
      if(st === 'available') badgeCls = 'badge-ok';
      else if(st === 'failed' || st === 'error') badgeCls = 'badge-err';
      return `<tr>
        <td><input type="checkbox" class="compare-check" data-orgnr="${esc(p.orgnr)}" ${selected.has(p.orgnr) ? 'checked' : ''} aria-label="Select ${esc(p.name)} for comparison"></td>
        <td style="color:var(--text-muted);font-size:.78rem">${i+1}</td>
        <td class="name">${esc(p.name)}</td>
        <td class="orgnr">${p.orgnr}</td>
        <td><span class="badge ${badgeCls}">${badgeLabel}</span></td>
        <td style="text-align:right"><a class="view-link" href="${p.profile_url}" target="_blank">View profile</a></td>
      </tr>`;
    }).join('');
  }

  input.addEventListener('input', render);
  stateFilter.addEventListener('change', render);
  categoryFilter.addEventListener('change', render);
  tbody.addEventListener('change', event => {
    if (!event.target.classList.contains('compare-check')) return;
    const orgnr = event.target.dataset.orgnr;
    if (event.target.checked) selected.add(orgnr); else selected.delete(orgnr);
    updateCompareBar();
  });
  document.getElementById('compareButton').addEventListener('click', () => {
    const chosen = profiles.filter(p => selected.has(p.orgnr));
    if (chosen.length < 2) { comparePanel.innerHTML = '<p class="empty">Select at least two profiles to compare.</p>'; comparePanel.classList.add('visible'); return; }
    comparePanel.innerHTML = `<table><thead><tr><th>Fact</th>${chosen.map(p => `<th>${esc(p.name)}<br><small>${esc(p.orgnr)}</small></th>`).join('')}</tr></thead><tbody>${['state','city','industry'].map(field => `<tr><th>${field}</th>${chosen.map(p => `<td>${esc(p[field] || 'Not reported')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    comparePanel.classList.add('visible');
  });
  function updateCompareBar() {
    compareCount.textContent = `${selected.size} profile${selected.size === 1 ? '' : 's'} selected`;
    compareBar.classList.toggle('visible', selected.size > 0);
  }

  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
})();
</script>
</body>
</html>
